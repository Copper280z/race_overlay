name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: Package ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            command: ./scripts/build-linux-package.sh
            artifact_name: race-overlay-linux-x86_64
            artifact_path: target/release/race-overlay-linux-x86_64.tar.gz
            ffmpeg_url_var: FFMPEG_BUNDLE_LINUX_X64_URL
            ffmpeg_sha_var: FFMPEG_BUNDLE_LINUX_X64_SHA256
          - name: macOS Apple silicon
            os: macos-15
            command: ./scripts/build-macos-app.sh
            artifact_name: race-overlay-macos-arm64
            artifact_path: target/release/race-overlay-macos-arm64.zip
            ffmpeg_url_var: FFMPEG_BUNDLE_MACOS_ARM64_URL
            ffmpeg_sha_var: FFMPEG_BUNDLE_MACOS_ARM64_SHA256
          - name: Windows x64
            os: windows-2022
            command: pwsh -File ./scripts/build-windows-package.ps1
            artifact_name: race-overlay-windows-amd64
            artifact_path: target/release/race-overlay-windows-amd64.zip
            ffmpeg_url_var: FFMPEG_BUNDLE_WINDOWS_X64_URL
            ffmpeg_sha_var: FFMPEG_BUNDLE_WINDOWS_X64_SHA256
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - name: Download reviewed FFmpeg bundle
        if: ${{ vars[matrix.ffmpeg_url_var] != '' }}
        shell: pwsh
        env:
          BUNDLE_URL: ${{ vars[matrix.ffmpeg_url_var] }}
          BUNDLE_SHA256: ${{ vars[matrix.ffmpeg_sha_var] }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUNDLE_SHA256)) {
            throw "An FFmpeg bundle URL requires its matching SHA-256 repository variable"
          }
          $Archive = Join-Path $env:RUNNER_TEMP "ffmpeg-bundle.zip"
          $BundleDir = Join-Path $env:RUNNER_TEMP "ffmpeg-bundle"
          Invoke-WebRequest -Uri $env:BUNDLE_URL -OutFile $Archive
          $ActualHash = (Get-FileHash -Algorithm SHA256 $Archive).Hash
          if ($ActualHash -ne $env:BUNDLE_SHA256) {
            throw "FFmpeg bundle SHA-256 mismatch: expected $env:BUNDLE_SHA256, got $ActualHash"
          }
          Expand-Archive -Path $Archive -DestinationPath $BundleDir
          "RACE_OVERLAY_FFMPEG_BUNDLE=$BundleDir" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build package
        shell: bash
        run: ${{ matrix.command }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          pattern: race-overlay-*
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum race-overlay-* > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "Race Overlay $RELEASE_TAG"
          fi
