name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: Test and lint
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Select stable Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run tests
        run: cargo test --workspace
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  package:
    name: Package ${{ matrix.name }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            command: ./scripts/build-linux-package.sh
            artifact_name: race-overlay-linux-x86_64
            artifact_path: target/release/race-overlay-linux-x86_64.tar.gz
          - name: macOS Apple silicon
            os: macos-15
            command: ./scripts/build-macos-app.sh
            artifact_name: race-overlay-macos-arm64
            artifact_path: target/release/race-overlay-macos-arm64.zip
          - name: Windows x64
            os: windows-2022
            command: pwsh -File ./scripts/build-windows-package.ps1
            artifact_name: race-overlay-windows-amd64
            artifact_path: target/release/race-overlay-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Select stable Rust
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake ninja-build nasm libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev pkg-config
      - name: Set up Windows FFmpeg toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
      - name: Build bundled FFmpeg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/build-ffmpeg-bundle.sh ffmpeg-bundle
          echo "RACE_OVERLAY_FFMPEG_BUNDLE=$GITHUB_WORKSPACE/ffmpeg-bundle" >> "$GITHUB_ENV"
      - name: Build bundled FFmpeg on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          RACE_OVERLAY_FFMPEG_BUILD_DIR=ffmpeg-build ./scripts/build-ffmpeg-bundle.sh ffmpeg-bundle
          echo "RACE_OVERLAY_FFMPEG_BUNDLE=$GITHUB_WORKSPACE/ffmpeg-bundle" >> "$GITHUB_ENV"
      - name: Build package
        shell: bash
        run: ${{ matrix.command }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v5
        with:
          pattern: race-overlay-*
          path: dist
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum race-overlay-* > SHA256SUMS.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" ./* --clobber
            if [[ "$RELEASE_TAG" == *-* ]]; then
              gh release edit "$RELEASE_TAG" --prerelease
            fi
          else
            prerelease=
            if [[ "$RELEASE_TAG" == *-* ]]; then
              prerelease=--prerelease
            fi
            gh release create "$RELEASE_TAG" ./* --verify-tag --generate-notes --title "Race Overlay $RELEASE_TAG" $prerelease
          fi
