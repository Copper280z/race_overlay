[package]
name = "race-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
egui_dock.workspace = true
egui_plot.workspace = true
flate2.workspace = true
log.workspace = true
overlay-core = { path = "../crates/overlay-core" }
overlay-logger = { path = "../crates/overlay-logger" }
overlay-media = { path = "../crates/overlay-media" }
overlay-render = { path = "../crates/overlay-render" }
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
image = { workspace = true, features = ["jpeg"] }
ureq.workspace = true

# Native menu bar; macOS only. Other platforms use the in-window header.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dev-dependencies]
overlay-logger = { path = "../crates/overlay-logger", features = ["fake"] }
tempfile.workspace = true
# Renders the real UI offscreen for the opt-in visual snapshot tests.
egui_kittest = { version = "0.36", features = ["wgpu", "eframe"] }
